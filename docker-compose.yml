services:
  postgres:
    image: postgres:16-alpine
    container_name: everified-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: everified
      POSTGRES_PASSWORD: everified_local
      POSTGRES_DB: everified
    volumes:
      - everified_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everified -d everified"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  everified_pgdata:
